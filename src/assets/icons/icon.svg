<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆 -->
  <circle cx="64" cy="64" r="60" fill="#1a73e8"/>
  
  <!-- 蜘蛛网 -->
  <g stroke="white" stroke-width="2" fill="none">
    <!-- 中心到边缘的线 -->
    <line x1="64" y1="64" x2="64" y2="20"/>
    <line x1="64" y1="64" x2="100" y2="35"/>
    <line x1="64" y1="64" x2="108" y2="64"/>
    <line x1="64" y1="64" x2="100" y2="93"/>
    <line x1="64" y1="64" x2="64" y2="108"/>
    <line x1="64" y1="64" x2="28" y2="93"/>
    <line x1="64" y1="64" x2="20" y2="64"/>
    <line x1="64" y1="64" x2="28" y2="35"/>
    
    <!-- 同心圆环 -->
    <circle cx="64" cy="64" r="15"/>
    <circle cx="64" cy="64" r="30"/>
    <circle cx="64" cy="64" r="45"/>
  </g>
  
  <!-- 数据点 -->
  <g fill="white">
    <circle cx="64" cy="20" r="3"/>
    <circle cx="100" cy="35" r="3"/>
    <circle cx="108" cy="64" r="3"/>
    <circle cx="100" cy="93" r="3"/>
    <circle cx="64" cy="108" r="3"/>
    <circle cx="28" cy="93" r="3"/>
    <circle cx="20" cy="64" r="3"/>
    <circle cx="28" cy="35" r="3"/>
  </g>
  
  <!-- 中心图标 -->
  <circle cx="64" cy="64" r="8" fill="white"/>
  <circle cx="64" cy="64" r="4" fill="#1a73e8"/>
</svg>
